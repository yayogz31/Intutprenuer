name: Probe models
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in onnx-community/whisper-base onnx-community/whisper-small Xenova/whisper-base Xenova/opus-mt-es-en Xenova/opus-mt-en-es onnx-community/whisper-large-v3-turbo; do
            echo "=== $r"
            curl -fsSL "https://huggingface.co/api/models/$r/tree/main/onnx" | python3 -c "import json,sys;[print(f\"{f['size']/1e6:8.1f} MB  {f['path']}\") for f in json.load(sys.stdin)]" || echo "fail"
            curl -fsSL "https://huggingface.co/api/models/$r/tree/main" | python3 -c "import json,sys;print('   root:', ' '.join(f['path'] for f in json.load(sys.stdin)))" || true
          done

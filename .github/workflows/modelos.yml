name: Modelos de voz

# Descarga los modelos de reconocimiento de voz offline (Vosk, Apache-2.0) y los deja en /models
# para que GitHub Pages los sirva junto a la app. Corre una sola vez (o manualmente desde Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Volver a descargar aunque ya existan"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: modelos
  cancel-in-progress: false

jobs:
  modelos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar y empaquetar modelos
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          mkdir -p models
          pack () {
            local name="$1" out="$2"
            if [ -f "models/$out" ] && [ "${FORCE:-false}" != "true" ]; then
              echo "models/$out ya existe, se omite"; return
            fi
            tmp=$(mktemp -d)
            curl -fsSL --retry 3 "https://alphacephei.com/vosk/models/$name.zip" -o "$tmp/m.zip"
            unzip -q "$tmp/m.zip" -d "$tmp"
            mv "$tmp/$name" "$tmp/model"
            tar -C "$tmp" -czf "models/$out" model
            rm -rf "$tmp"
            ls -lh "models/$out"
          }
          pack vosk-model-small-es-0.42 es.tar.gz
          pack vosk-model-small-en-us-0.15 en.tar.gz

      - name: Whisper base (transcripción precisa)
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          R=onnx-community/whisper-base
          D=models/hf/$R
          if [ -f "$D/onnx/decoder_model_merged_quantized.onnx" ] && [ "${FORCE:-false}" != "true" ]; then echo "whisper ya existe"; exit 0; fi
          mkdir -p "$D/onnx"
          for f in config.json generation_config.json preprocessor_config.json tokenizer.json tokenizer_config.json \
                   added_tokens.json special_tokens_map.json vocab.json merges.txt normalizer.json \
                   onnx/encoder_model_quantized.onnx onnx/decoder_model_merged_quantized.onnx; do
            curl -fsSL --retry 3 "https://huggingface.co/$R/resolve/main/$f" -o "$D/$f"
          done
          du -sh "$D"

      - name: Whisper encoder para GPU (WebGPU, más rápido)
        run: |
          set -euo pipefail
          R=onnx-community/whisper-base
          D=models/hf/$R/onnx
          mkdir -p "$D"
          for f in encoder_model.onnx encoder_model_fp16.onnx; do
            if [ -f "$D/$f" ]; then echo "$f ya existe"; continue; fi
            curl -fsSL --retry 3 "https://huggingface.co/$R/resolve/main/onnx/$f" -o "$D/$f"
          done
          ls -lh "$D"

      - name: Whisper small para GPU (más preciso; archivos divididos en partes < 100 MB)
        run: |
          set -euo pipefail
          R=onnx-community/whisper-small
          D=models/hf/$R
          if [ -f "$D/onnx/decoder_model_merged_quantized.onnx.parts.json" ]; then echo "whisper-small ya existe"; exit 0; fi
          mkdir -p "$D/onnx"
          for f in config.json generation_config.json preprocessor_config.json tokenizer.json tokenizer_config.json \
                   added_tokens.json special_tokens_map.json vocab.json merges.txt normalizer.json; do
            curl -fsSL --retry 3 "https://huggingface.co/$R/resolve/main/$f" -o "$D/$f"
          done
          for f in encoder_model_fp16.onnx decoder_model_merged_quantized.onnx; do
            curl -fsSL --retry 3 "https://huggingface.co/$R/resolve/main/onnx/$f" -o "$D/onnx/$f"
            size=$(stat -c %s "$D/onnx/$f")
            split -b 90m -d -a 1 "$D/onnx/$f" "$D/onnx/$f.part"
            n=$(ls "$D/onnx/$f".part* | wc -l)
            echo "{\"parts\": $n, \"size\": $size}" > "$D/onnx/$f.parts.json"
            rm "$D/onnx/$f"
            ls -lh "$D/onnx/$f".part*
          done

      - name: Bergamot (traducción offline ES⇄EN)
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -f models/bergamot/registry.json ] && [ "${FORCE:-false}" != "true" ]; then echo "bergamot ya existe"; exit 0; fi
          mkdir -p models/bergamot
          python3 - <<'PY'
          import json, urllib.request, gzip, os, hashlib
          def get(url):
              data = urllib.request.urlopen(url).read()
              return gzip.decompress(data) if data[:2] == b"\x1f\x8b" else data
          idx = json.loads(get("https://bergamot.s3.amazonaws.com/models/index.json"))
          print("pares disponibles:", ", ".join(sorted(k for k in idx if k.startswith(("es", "en")))))
          out = {}
          for pair in ("esen", "enes"):
              files = idx[pair]
              print(pair, json.dumps(files)[:400])
              os.makedirs(f"models/bergamot/{pair}", exist_ok=True)
              out[pair] = {}
              for part, f in files.items():
                  if not isinstance(f, dict) or "name" not in f:
                      continue
                  url = f["name"]
                  if not url.startswith("http"):
                      url = "https://bergamot.s3.amazonaws.com/models/" + url
                  data = get(url)
                  name = os.path.basename(url)
                  if name.endswith(".gz"):
                      name = name[:-3]
                  path = f"models/bergamot/{pair}/{name}"
                  open(path, "wb").write(data)
                  out[pair][part] = {"name": path, "size": len(data), "expectedSha256Hash": hashlib.sha256(data).hexdigest()}
                  print(pair, part, name, round(len(data) / 1e6, 1), "MB")
          json.dump(out, open("models/bergamot/registry.json", "w"), indent=1)
          PY

      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar modelos offline (voz y traducción)"
          git push

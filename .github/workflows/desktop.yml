name: App de escritorio (Windows)

# Compila la app de escritorio (desktop/), genera el instalador y lo prueba en Windows:
#  - prueba de humo con el instalador real: instalar, descargar modelos, transcribir un WAV, desinstalar
#  - revisa que no quede basura fuera de la carpeta de la app
# En main, publica el instalador en Releases. No toca la página (raíz, data/, vendor/, models/).
on:
  push:
    branches: [main, "claude/**"]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  # Modelos de traducción para la app (los mismos de la página), publicados una sola vez en Releases.
  modelos-traduccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: models/bergamot
      - name: Publicar models-v1 (si falta)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view models-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "models-v1 ya existe"; exit 0; fi
          cd models/bergamot
          sha256sum esen/* enes/*
          gh release create models-v1 --repo "$GITHUB_REPOSITORY" --title "Translation models (one-time download)" \
            --notes "Bergamot ES⇄EN (MPL-2.0). The desktop app downloads these files once and checks their SHA-256." \
            --target "$GITHUB_SHA" --prerelease \
            esen/vocab.esen.spm esen/lex.50.50.esen.s2t.bin esen/model.esen.intgemm.alphas.bin \
            enes/lex.50.50.enes.s2t.bin enes/model.enes.intgemm.alphas.bin

  windows:
    needs: modelos-traduccion
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            desktop
            .github

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Vulkan SDK (para compilar whisper.cpp con GPU)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true
          stripdown: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar e instalar en un paquete (NSIS)
        working-directory: desktop/app
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@2 build *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\build.log" | Out-Null
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # solo las líneas útiles para diagnosticar (sin las advertencias de CMake)
            Select-String -Path "$env:RUNNER_TEMP\build.log" -Pattern "error|failed|fatal|cannot|not found|No such" -CaseSensitive:$false |
              Where-Object { $_.Line -notmatch "CMake Warning|Wno-|Werror|error_callback|ERROR_" } | Select-Object -First 80 | ForEach-Object { $_.Line }
            Get-Content "$env:RUNNER_TEMP\build.log" -Tail 25
            exit $code
          }
          Get-Content "$env:RUNNER_TEMP\build.log" -Tail 15

      - name: Tamaños
        shell: pwsh
        run: |
          $exe = Get-Item desktop/target/release/Inturpreneur.exe
          $setup = Get-ChildItem desktop/target/release/bundle/nsis/*.exe | Select-Object -First 1
          "Ejecutable: {0:N1} MB" -f ($exe.Length / 1MB)
          "Instalador: {0:N1} MB  ({1})" -f ($setup.Length / 1MB), $setup.Name
          "SETUP=$($setup.FullName)" | Out-File -Append $env:GITHUB_ENV

      - name: Prueba de humo con el instalador real (CPU; el runner no tiene GPU)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Snap { @{
            local = (Get-ChildItem $env:LOCALAPPDATA -Force -ErrorAction SilentlyContinue | ForEach-Object Name)
            roaming = (Get-ChildItem $env:APPDATA -Force -ErrorAction SilentlyContinue | ForEach-Object Name)
            temp = (Get-ChildItem $env:TEMP -Force -ErrorAction SilentlyContinue | ForEach-Object Name) } }
          $before = Snap
          # 1) instalar (modo silencioso, carpeta por defecto: %LOCALAPPDATA%\Inturpreneur)
          Start-Process -FilePath $env:SETUP -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "Inturpreneur"
          if (-not (Test-Path "$dir\Inturpreneur.exe")) { throw "La app no quedó instalada en $dir" }
          Get-ChildItem $dir | Format-Table Name, Length
          # 2) arrancar el núcleo: descarga los modelos (una vez, con SHA-256), transcribe el WAV y termina
          $wav = (Resolve-Path desktop/tests/audio/en_seguros.wav).Path
          $out = Join-Path $env:RUNNER_TEMP "smoke.json"
          $p = Start-Process -FilePath "$dir\Inturpreneur.exe" -ArgumentList "--smoke", "`"$wav`"", "`"$out`"" -Wait -PassThru
          $r = Get-Content $out -Raw | ConvertFrom-Json
          "Código de salida: $($p.ExitCode) · frases: $($r.finals) · segundos: $([math]::Round($r.seconds,1))"
          "RAM del núcleo: $($r.rss_call_mb) MB en llamada → $($r.rss_after_end_mb) MB tras End"
          $r.diagnostics
          $r.events | Where-Object { $_.type -in @("final", "refined") } | ForEach-Object { "{0,-8} seg {1}: {2}" -f $_.type, $_.seg, $_.text }
          Copy-Item $out smoke.json
          if ($p.ExitCode -ne 0 -or $r.finals -lt 1) { throw "La prueba de humo falló" }
          Get-ChildItem "$dir\models" -Recurse | Format-Table FullName, Length
          # 3) desinstalar y revisar que no quede nada
          Start-Process -FilePath "$dir\uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $dir) { Get-ChildItem $dir -Recurse -Force; throw "Quedaron archivos en $dir tras desinstalar" }
          $after = Snap
          $leftovers = @()
          foreach ($k in "local", "roaming", "temp") {
            $new = $after[$k] | Where-Object { $before[$k] -notcontains $_ }
            if ($new) { $leftovers += "$k" + ": " + ($new -join ", ") }
          }
          if ($leftovers) { "Entradas nuevas (revisar): $($leftovers -join ' | ')" } else { "Sin basura: %LOCALAPPDATA%, %APPDATA% y %TEMP% quedaron igual." }
          if ($after.local | Where-Object { $_ -like "*inturp*" }) { throw "Quedó una carpeta de la app en %LOCALAPPDATA%" }
          if ($after.roaming | Where-Object { $_ -like "*inturp*" }) { throw "Quedó una carpeta de la app en %APPDATA%" }

      - uses: actions/upload-artifact@v4
        with:
          name: Inturpreneur-instalador-windows
          path: |
            desktop/target/release/bundle/nsis/*.exe
            smoke.json
          retention-days: 14

      - name: Publicar en Releases (solo main)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content desktop/app/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Inturpreneur $v (test build)" --prerelease --target $env:GITHUB_SHA `
              --notes "Desktop app for Windows 11. Download the setup file below, run it, and follow the steps in desktop/README.md."
          }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber $env:SETUP
